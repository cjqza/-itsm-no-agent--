version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/it_ops.db:/app/it_ops.db
    environment:
      - DB_TYPE=sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/captcha"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend-client:
    build:
      context: ./frontend-client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-agent:
    build:
      context: ./frontend-agent
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-ops:
    build:
      context: ./frontend-ops
      dockerfile: Dockerfile
    ports:
      - "5176:80"
    depends_on:
      - backend
    restart: unless-stopped
